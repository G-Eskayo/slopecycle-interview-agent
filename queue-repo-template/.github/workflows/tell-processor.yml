# Runs on Noah's Mac (a self-hosted runner), never in GitHub's cloud. It only rings the processor's doorbell:
# no checkout, so interview files are never copied anywhere by this job (ADR 0006).
name: Tell the processor a new interview arrived
on:
  push:
    branches: [main]
    paths: ["submissions/**"]
concurrency:
  group: processor-doorbell   # one waiting ring is enough; the processor works out everything that's new
  cancel-in-progress: false
jobs:
  ring:
    runs-on: [self-hosted, macOS, slopecycle-processor]
    timeout-minutes: 3
    steps:
      - name: Ring the doorbell
        run: curl -fsS -X POST --max-time 30 --retry 5 --retry-connrefused --retry-delay 5 http://127.0.0.1:5678/webhook/slopecycle-run
