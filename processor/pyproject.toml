[project]
name = "slope-processor"
version = "0.1.0"
description = "SlopeCycle interview analyst: ledger, extraction and validation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slope_processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Ollama with the configured model (SLOPE_LIVE=1)"]
